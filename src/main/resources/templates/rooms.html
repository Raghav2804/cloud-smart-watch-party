<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My rooms</title><link rel="stylesheet" href="/css/app.css"></head>
<body><header><strong>Cloud Smart Watch Party</strong><form method="post" action="/logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="link">Sign out</button></form></header>
<main><section class="hero"><h1>Your watch rooms</h1><p>Create a room, share its code, and watch together.</p></section>
<section class="card"><h2>Create a room</h2><form method="post" action="/rooms" th:object="${roomForm}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Room name<input th:field="*{name}" maxlength="120" required placeholder="Movie night"><small th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small></label><label>Video URL <span class="muted">(optional)</span><input th:field="*{videoUrl}" maxlength="1000" type="url" placeholder="https://...mp4"><small th:if="${#fields.hasErrors('videoUrl')}" th:errors="*{videoUrl}"></small></label><button type="submit">Create room</button></form></section>
<section class="card"><h2>Join a room</h2><form class="inline" method="post" action="/room/placeholder/join" onsubmit="this.action='/room/'+this.code.value.trim().toUpperCase()+'/join';return true"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="code" maxlength="6" pattern="[A-Za-z0-9]{6}" placeholder="Six-character code" required><button>Join room</button></form></section>
<section class="card"><h2>Your rooms</h2><div class="rooms"><a class="room" th:each="r:${rooms}" th:href="@{/room/{code}(code=${r.code})}"><strong th:text="${r.name}">Room</strong><span>Code: <b th:text="${r.code}">CODE</b></span><span th:text="${r.memberCount}+' member(s)'">1 member</span></a><p th:if="${#lists.isEmpty(rooms)}" class="muted">You have not joined a room yet.</p></div></section></main></body></html>
