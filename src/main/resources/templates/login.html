<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Watch Party</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="card narrow"><h1>Cloud Smart Watch Party</h1><p>Watch together, wherever you are.</p><div th:if="${param.error}" class="error">Invalid username or password.</div><div th:if="${param.registered}" class="success">Account created. Sign in.</div><form method="post" action="/login"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Username<input name="username" required autofocus></label><label>Password<input type="password" name="password" required></label><button>Sign in</button></form><a href="/register">Create an account</a></main></body></html>
