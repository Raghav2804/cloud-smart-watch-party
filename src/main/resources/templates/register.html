<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account</title><link rel="stylesheet" href="/css/app.css"></head>
<body><main class="card narrow"><h1>Create your account</h1><p class="muted">Start a shared watch session in minutes.</p>
<form method="post" action="/register" th:object="${form}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<label>Display name<input th:field="*{displayName}" autocomplete="name" required><small th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}"></small></label>
<label>Email<input type="email" th:field="*{email}" autocomplete="email" required><small th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small></label>
<label>Username<input th:field="*{username}" autocomplete="username" required><small th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></small></label>
<label>Password<input type="password" th:field="*{password}" autocomplete="new-password" minlength="8" required><small th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small></label>
<label>Confirm password<input type="password" th:field="*{confirmPassword}" autocomplete="new-password" minlength="8" required><small th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></small></label>
<button type="submit">Create account</button></form><a href="/login">Already have an account? Sign in</a></main></body></html>
