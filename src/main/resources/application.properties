spring.application.name=cloud-smart-watch-party
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/watchparty;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.port=8080
# For local debugging only: spring.h2.console.enabled=true
